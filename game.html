<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART მიზნები</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Noto Sans Georgian', sans-serif;
    background: linear-gradient(135deg, #f0f4ff, #d9e4ff);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }
  #game-container {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    width: 90%;
    max-width: 600px;
    margin: 40px 0;
    padding: 30px;
  }
  h2 {
    color: #3a7bd5;
    text-align: center;
    margin-bottom: 20px;
    font-size: 28px;
  }
  input {
    width: 100%;
    padding: 15px;
    font-size: 18px;
    margin: 15px 0;
    border-radius: 10px;
    border: 2px solid #3a7bd5;
  }
  input:focus {
    border-color: #1a5fc1;
    outline: none;
  }
  button {
    padding: 15px 25px;
    font-size: 18px;
    margin: 10px 5px;
    cursor: pointer;
    background: #3a7bd5;
    color: white;
    border: none;
    border-radius: 12px;
  }
  .goal-card {
    background: linear-gradient(135deg, #e2e8ff, #f0f4ff);
    border-left: 5px solid #3a7bd5;
    border-radius: 15px;
    padding: 15px 20px;
    margin: 15px 0;
    word-wrap: break-word;
  }
  .goal-field {
    margin: 5px 0;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .buttons { text-align: center; margin-top: 20px; }
</style>
</head>
<body>
<div id="game-container">
  <h2>SMART მიზნები</h2>
  <div class="buttons">
    <button class="start-goal">დამატება ახალი მიზანი</button>
    <button class="show-goals">მიზნების ჩვენება</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
