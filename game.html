<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMART მიზნები</title>
<link rel="stylesheet" href="style.css">
<style>
  body { font-family: 'Noto Sans Georgian', sans-serif; padding: 20px; background: #fdfdfd; }

  input { width: 100%; padding: 10px; margin: 10px 0; font-size: 18px; }
  button { padding: 10px 20px; font-size: 18px; margin-top: 10px; cursor: pointer; background: #3a7bd5; color: white; border: none; border-radius: 5px; }
  pre { background: #eee; padding: 10px; border-radius: 5px; }
</style>
</head>
<body>
<div id="game-container">
    <button onclick="startGoal()">დამატება ახალი მიზანი</button>
    <button onclick="showGoals()">მიზნების ჩვენება</button>
</div>
<script src="script.js"></script>
</body>
</html>
